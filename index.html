<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Report Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loginView" class="center-box">
  <h2>Task Report Login</h2>
  <input id="loginUsername" placeholder="Username">
  <input id="loginPassword" type="password" placeholder="Password">
  <button onclick="handleLogin()">Log In</button>
  <p id="loginError" class="error"></p>
</div>
<div id="appView" class="hidden">
  <nav>
    <span id="welcomeText"></span>
    <button onclick="showView('dashboard')">Dashboard</button>
    <button onclick="showView('tasks')">Tasks</button>
    <button id="adminNavBtn" class="hidden" onclick="showView('admin')">Admin</button>
    <button onclick="openChangePassword()">Change Password</button>
    <button onclick="logout()">Log Out</button>
  </nav>
  <section id="dashboardView">
    <h2>Dashboard</h2>
    <div class="selectors">
      <select id="dashUserSelect" class="hidden"></select>
      <select id="dashMonthSelect"></select>
      <select id="dashYearSelect"></select>
      <button onclick="loadDashboard()">Load</button>
    </div>
    <div class="dash-grid">
      <div style="position: relative; width: 100%; max-width: 350px; height: 300px; margin: 0 auto;">
        <canvas id="statusChart"></canvas>
      </div>
      <div id="stageCountsTable"></div>
      <div id="overdueBox"></div>
    </div>
  </section>
  <section id="tasksView" class="hidden">
    <h2>Tasks</h2>
    <div class="selectors">
      <select id="taskUserSelect" class="hidden"></select>
      <select id="taskMonthSelect"></select>
      <select id="taskYearSelect"></select>
      <button onclick="loadTasks()">Load</button>
    </div>
    <table id="tasksTable">
      <thead><tr><th>S.No</th><th>Assigned</th><th>Task</th><th>Priority</th><th>Due Date</th><th>Status</th><th>Days on Status</th><th>%</th></tr></thead>
      <tbody></tbody>
    </table>
    <h3>Add Task</h3>
    <input id="newTaskText" placeholder="Task description">
    <select id="newTaskPriority"><option>Low</option><option>Medium</option><option>High</option></select>
    <input id="newTaskDueDate" type="date">
    <button onclick="submitAddTask()">Add Task</button>
  </section>
  <section id="adminView" class="hidden">
    <h2>Admin - Manage Users</h2>
    <table id="usersTable">
      <thead><tr><th>Username</th><th>Full Name</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
    <h3>Create New User</h3>
    <input id="newUsername" placeholder="Username">
    <input id="newFullName" placeholder="Full Name">
    <input id="newUserPassword" placeholder="Initial Password">
    <select id="newUserRole"><option value="user">user</option><option value="admin">admin</option></select>
    <button onclick="submitCreateUser()">Create User</button>
  </section>
</div>
<div id="changePasswordModal" class="modal hidden">
  <div class="modal-content">
    <h3>Change Password</h3>
    <input id="oldPassword" type="password" placeholder="Current password">
    <input id="newPassword" type="password" placeholder="New password">
    <button onclick="submitChangePassword()">Update</button>
    <button onclick="closeChangePassword()">Cancel</button>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
